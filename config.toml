# 共通設定 (macOS / OCI の両方で常に読み込まれる)。
# OS 固有の設定は machine module に分ける:
#   - config.macos.toml : macOS (AmacBook)
#   - config.oci.toml   : OCI の Linux サーバー
# 各マシンは git 管理外の miserc.local.toml で読み込む module を選ぶ
# (例: `env = ["macos"]`)。miserc.local.toml の読み込みに 2026.10 系が必要。
min_version = "2026.10.13"

[settings]
experimental = true
cargo.binstall_only = true
idiomatic_version_file_enable_tools = ["python", "node", "go"]
# `mise bootstrap` が tools phase で導入する。日常の task 実行では自動導入しない。
task.run_auto_install = false
# lockfile で解決済みバージョン/URL を固定し、初回 provisioning の latest 解決と
# GitHub/aqua への API 呼び出しを削減する。更新は `mise lock --global --bump`。
lockfile = true
# 実際に使うマシンのプラットフォームだけを lock 対象にする (既定は7種)。
lockfile_platforms = ["linux-arm64", "macos-arm64"]

[tools]
cargo-binstall = "latest"

# --- 言語ランタイム ---
node = "latest"
go = "latest"
python = "latest"
ruby = "latest"
deno = "2"
uv = "latest"
"aqua:pnpm" = "11"
rust = "stable" # core:rust が rustup 経由で管理
sccache = "latest"
# .NET SDK (GCM の dotnet: backend に必要。現行 GCM は .NET SDK 10 必須)。
dotnet = "10"
# Git Credential Manager (.NET tool として mise 管理。git 側の helper=manager が shim を解決)。
# NOTE: `mise install` は `git-credential-manager configure` 相当を行わないが、
# config/git/config で helper を宣言済みのため初回の configure 手順は不要。
"dotnet:git-credential-manager" = "latest"

# --- シェル・シェル統合 ---
"aqua:fish-shell/fish-shell" = "latest"
fzf = "latest"
fd = "latest"
"github:iffse/pay-respects" = "latest"
"github:tetzng/pez" = "latest"

# --- LSP / Formatter ---
# (clangd / nil / vim-language-server は mise に無いため mason 維持)
"github:atusy/kakehashi" = "latest"
"aqua:astral-sh/ty" = "latest"
"npm:basedpyright" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
tree-sitter = "latest"
"cargo:mergiraf" = "latest"
"npm:fish-lsp" = "latest"
"aqua:astral-sh/ruff" = "latest"
"aqua:biomejs/biome" = "latest"
"aqua:tamasfe/taplo" = "latest"
"aqua:Myriad-Dreamin/tinymist" = "latest"
"aqua:rhysd/actionlint" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:@typespec/compiler" = "latest"
"npm:oxlint" = "latest"
"aqua:github/copilot-language-server-release" = "latest"
# NOTE: latest は beta を拾うため stable 系列にピン留め
"gem:ruby-lsp" = "0.26"

# --- 開発 CLI ---
gh = "latest"
lazygit = "latest"
jq = "latest"
jnv = "latest"
"pipx:litecli" = "latest"
hunkdiff = "latest"
"github:gw31415/commitgen" = { version = "latest", bin = "commitgen" }
"github:gw31415/rsplug.nvim" = { version = "latest", bin = "rsplug" }
usage = "latest"
"go:github.com/rhysd/vim-startuptime" = "latest"

# --- AI エージェント ---
claude = "latest"
codex = "latest"
oh-my-pi = "latest"
"pipx:serena-agent" = "latest"
"npm:@wonderwhy-er/desktop-commander" = "latest"

# --- 日常 CLI ---
# aria2 = "latest" # バイナリインストールできる手段が存在しない
bat = "latest"
eza = "latest"
ripgrep = "latest"
"github:microsoft/tgrep" = "latest"
tmux = "latest"
tssh = "latest"
aube = "latest"
"npm:trash-cli" = "latest"
"go:github.com/itchyny/mmv/cmd/mmv" = "latest"
"aqua:neovim" = "latest"
"github:gw31415/rusk" = "latest"
"github:Ameyanagi/yuru" = "latest"
"aqua:charmbracelet/freeze" = "latest"
"pipx:asciinema" = "latest"
vhs = "latest"

# --- メディア・文書 ---
yt-dlp = "latest"
ffmpeg = "latest"
imagemagick = "latest"
"7zip" = "latest"
pandoc = "latest"
# conda backend は prebuilt 配布が conda-forge にしか無いこの2点のみ。
"conda:poppler" = "latest"
"conda:librsvg" = "latest"

# --- linux-arm64 向けの配布が無いもの (macOS と x64 Linux のみ) ---
"cargo:https://github.com/itsjunetime/tdf" = { version = "latest", os = ["macos", "linux/x64"] }
"github:isak102/neowright" = { version = "latest", os = ["macos", "linux/x64"] }
mdbook = { version = "latest", os = ["macos", "linux/x64"] }
# "cargo:https://github.com/jkcoxson/idevice_pair" = "latest"

# NOTE: aquaレジストリなし・npmなし・cargoはbinstall提供なし・ubiは非推奨のためgithubバックエンド。
# 同一リリースに複数バイナリ同梱のためtool_alias+matchingで分割する。
[tool_alias]
emmylua_ls = "github:EmmyLuaLs/emmylua-analyzer-rust"
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"
luafmt = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools.emmylua_ls]
version = "latest"
matching = "emmylua_ls"

[tools.emmylua_check]
version = "latest"
matching = "emmylua_check"

[tools.luafmt]
version = "latest"
matching = "luafmt"

# NOTE: RSPLUG_CONFIG_FILES は config/fish/conf.d/15-rsplug.fish で定義
#       (mise の {{ config_root }} は user-global では $HOME を指すため fish 側で解決)。
[env]
EDITOR = "nvim" # aqua:neovim の shim が提供
DIRENV_LOG_FORMAT = ""
GOPATH = "{{ env.HOME }}/.go" # go は mise 管理
RUSTC_WRAPPER = "{{ env.HOME }}/.local/share/mise/shims/sccache"

[wrappers]
ssh = "tssh"

# mise の宣言的 dotfile 管理。`mise bootstrap --adopt` はこの repository を
# ~/.config/mise に clone するため、source は repository root からの相対パス。
# fish の3ディレクトリは pez が管理外の plugin ファイルを配置するため
# symlink-each にし、mise が所有する leaf だけを更新する。
[dotfiles]
# エディタ
"~/.config/nvim/after" = { source = "config/nvim_after", mode = "symlink" }
"~/.config/nvim/init.lua" = { source = "config/nvim/init.lua", mode = "symlink" }
"~/.config/nvim/lua" = { source = "config/nvim_lua", mode = "symlink" }
"~/.config/kakehashi" = { source = "config/kakehashi", mode = "symlink" }
"~/.skk/SKK-JISYO.L" = { source = "files/SKK-JISYO.L", mode = "symlink" }
# fish
"~/.config/fish/completions" = { source = "config/fish_completions", mode = "symlink-each" }
"~/.config/fish/conf.d" = { source = "config/fish/conf.d", mode = "symlink-each" }
"~/.config/fish/functions" = { source = "config/fish_functions", mode = "symlink-each" }
"~/.config/fish/pez-lock.toml" = { source = "config/fish/pez-lock.toml", mode = "symlink" }
"~/.config/fish/pez.toml" = { source = "config/fish/pez.toml", mode = "symlink" }
# git
"~/.config/git/attributes" = { source = "config/git/attributes", mode = "symlink" }
"~/.config/git/config" = { source = "config/git/config", mode = "symlink" }
"~/.config/git/ignore" = { source = "config/git/ignore", mode = "symlink" }
"~/.config/commitgen" = { source = "config/commitgen", mode = "symlink" }
"~/.config/lazygit" = { source = "config/lazygit", mode = "symlink" }
# その他 CLI
"~/.config/fd/ignore" = { source = "config/fd/ignore", mode = "symlink" }
"~/.config/freeze" = { source = "config/freeze", mode = "symlink" }
"~/.config/herdr" = { source = "config/herdr", mode = "symlink" }

# [tools] を導入した後だけ必要な pez 操作は native bootstrap hook に置く。
[bootstrap.hooks.post-tools]
run = [
  "mise exec -- pez install",
  "mise exec -- pez doctor",
]

[tasks.update]
description = "Update declarative system packages, mise tools, and fish plugins"
run = [
  "mise bootstrap packages upgrade",
  "mise upgrade --bump",
  "mise exec -- pez upgrade",
  "mise exec -- pez doctor",
]
