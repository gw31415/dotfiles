# [tools] を導入した後だけ必要な pez 操作は native bootstrap hook に置く。
[bootstrap.hooks.post-tools]
run = [
  "mise exec -- pez install",
  "mise exec -- pez doctor",
]

# built-in package phase では PATH にない mas を skip することがあるため、
# Homebrew の bin を追加した mise env で Mac App Store entries だけを収束する。
[bootstrap.hooks.post-packages]
run = 'test "$(uname)" != Darwin || mise exec -- mise bootstrap packages apply --manager mas'

[tasks.update]
description = "Update declarative system packages, mise tools, and fish plugins"
run = [
  "mise bootstrap packages upgrade",
  "mise upgrade --bump",
  "mise exec -- pez upgrade",
  "mise exec -- pez doctor",
]
