# OCI module。miserc.local.toml に `env = ["oci"]` を置いた OCI の Linux サーバーでだけ読み込む。
#
# 現時点で OCI 専用に足すツール・dotfile は無く、共通設定 (config.toml) だけで足りる。
# この module は「OCI では何を入れないか」を明示する置き場でもある:
#   - macOS module のもの (GUI アプリ・zsh・TeX・CoreAudio・tunnel-client 等) は読み込まない。
#   - ログインシェルは fish (下の [bootstrap.user])。
#   - 次のサーバー常駐はこの dotfiles の管理外 (root 権限の system service):
#       dev-session-mcp (/opt/dev-session-mcp, dev-session-mcp-*.service)
#       cloudflared-dev-session-mcp.service (apt の cloudflared)
#       dev-session-mcp-tunnel.service (/usr/local/bin/tunnel-client)
#
# OCI だけで必要なものが出てきたら、ここに [tools] / [dotfiles] /
# [bootstrap.linux.systemd.units] などを追加する。

# ログインシェル。fish は mise (aqua) 管理のため、版に依存しない latest の symlink を指す。
# mise は path の存在を確かめずに chsh するので、先に `mise bootstrap tools` を済ませ、
# 別の SSH セッションを開いたまま `mise bootstrap user apply` する。
[bootstrap.user]
login_shell = "{{ env.HOME }}/.local/share/mise/installs/aqua-fish-shell-fish-shell/latest/fish"

# rsplug の設定 (config/nvim_rsplug/*.toml) を監視し、変わるたびに再ビルドする。
# 新しい世代が公開されると、起動中の Neovim は require('rsplug').watch() で気づく。
# unit には mise の activate が効かないので、ビルドで使う nvim・git を shims から渡す。
# ログアウト後も動かすには一度だけ `sudo loginctl enable-linger $USER` が要る。
[bootstrap.linux.systemd.units.rsplug-watch]
description = "rsplug config watcher"
exec_start = "{{ env.HOME }}/.local/share/mise/shims/rsplug --watch -i {{ env.HOME }}/.config/mise/config/nvim_rsplug/*.toml"
environment = { PATH = "{{ env.HOME }}/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin" }
working_directory = "{{ env.HOME }}"
restart = "on-failure"
