{#- herdr の config.toml。mise が [dotfiles] の template として ~/.config/herdr/config.toml に描画する。
    herdr の default_shell は ~ や環境変数を展開せず、herdr サーバーの PATH には mise の shim が
    入らないことがあるため、fish は OS ごとの絶対パスで指定する。 -#}
{%- if os() == "macos" -%}
{%- set fish = "/opt/homebrew/bin/fish" -%}
{%- else -%}
{%- set fish = env.HOME ~ "/.local/share/mise/installs/aqua-fish-shell-fish-shell/latest/fish" -%}
{%- endif -%}
onboarding = false

[terminal]
default_shell = "{{ fish }}"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
agent_panel_sort = "priority"
sound.enabled = true

[ui.toast]
delivery = "terminal"

[update]
channel = "stable"

[keys]
prefix = "super+b"
detach = ["prefix+q", "super+w"]

# Compose text (e.g. Japanese via SKK) in a small nvim split and send it to the
# previously focused pane when nvim is saved-and-quit (:wq). See `herdr_editor`.
[[keys.command]]
key = "prefix+i"
type = "shell"
command = "{{ fish }} -c herdr_editor"
description = "compose text to input"

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = true
