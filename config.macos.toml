# macOS 26.4 以降は既定アプリを変えるたびに確認ダイアログが出る (同じ値の再設定では出ない)。
# ng.app は手動でビルドして入れるので、無い Mac では何もしない。
[bootstrap.hooks.post-defaults]
run = [
  """
  if [ -d "$HOME/Applications/ng.app" ]; then
    /opt/homebrew/bin/utiluti manage --include-unmanaged
  fi
  """,
]

########################################
# LaunchAgents (旧 nix-darwin の launchd.user.agents)
########################################
# Neovim の denops プラグインが接続する共通 Deno サーバー。Vim/Neovim 起動ごとに
# Deno を spawn しないので denops 系プラグインがすぐ使える。
# サーバーは rsplug が入れた denops.vim と同じ版を使う (nvim 側と版がずれない)。
# rsplug 導入前や deno の shim が無い間は落ちるが、keep_alive が再試行する。
# Deno の引数を変えるときはポートも変え、config/nvim_rsplug/denops.toml の denops_server_addr と揃える。
[bootstrap.macos.launchd.agents.denops-shared-server]
program = "/bin/bash"
args = [
  "-c",
  """
  repo="$HOME/.cache/rsplug/repos/github.com/vim-denops/denops.vim"
  exec "$HOME/.local/share/mise/shims/deno" run -A --no-lock -q --unstable-kv \
    "$repo/worktrees/$(cat "$repo/latest-snapshot")/denops/@denops-private/cli.ts" \
    --hostname 127.0.0.1 --port 32124
  """,
]
run_at_load = true
keep_alive = true
throttle_interval = 30
stdout_path = "~/Library/Logs/denops-shared-server.log"
stderr_path = "~/Library/Logs/denops-shared-server.log"

# rsplug の設定 (config/nvim_rsplug/*.toml) を監視し、変わるたびに再ビルドする。
# 新しい世代が公開されると、起動中の Neovim は require('rsplug').watch() で気づく。
# launchd はシェルの環境を引き継がないので、ビルドで使う nvim・git を shims から渡す。
[bootstrap.macos.launchd.agents.rsplug-watch]
program = "{{ env.HOME }}/.local/share/mise/shims/rsplug"
args = ["--watch", "-i", "{{ env.HOME }}/.config/mise/config/nvim_rsplug/*.toml"]
environment = { PATH = "{{ env.HOME }}/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~"
run_at_load = true
keep_alive = true
throttle_interval = 30
stdout_path = "~/Library/Logs/rsplug-watch.log"
stderr_path = "~/Library/Logs/rsplug-watch.log"

# ローカル MCP サーバー (local-mcp) を OpenAI の制御プレーンへ常駐トンネルする。
# プロファイル local-mcp-stdio は api_key を env:CONTROL_PLANE_API_KEY で参照するため、
# 起動時に ~/.env を source する (シークレットを設定ファイルに書かない)。
# local-mcp は tunnel-client から PATH 経由で起動されるため mise shims を通す。
[bootstrap.macos.launchd.agents.tunnel-client]
program = "/bin/bash"
args = [
  "-c",
  """
  set -eo pipefail
  if [[ -f "$HOME/.env" ]]; then
    set -a
    source "$HOME/.env"
    set +a
  fi
  export PATH="$HOME/.local/share/mise/shims:$PATH"
  exec "$HOME/.local/share/mise/shims/tunnel-client" run --profile local-mcp-stdio
  """,
]
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/tunnel-client/tunnel-client.log"
stderr_path = "~/Library/Logs/tunnel-client/tunnel-client.error.log"
