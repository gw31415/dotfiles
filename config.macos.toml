# macOS module。miserc.local.toml に `env = ["macos"]` を置いた Mac でだけ読み込む。
# user-level の macOS 設定 (defaults・LaunchAgent・ログインシェル) もここで持つ。
# root 権限の設定・フォント・Tailscale・Nix 由来のパッケージは nix-darwin (nix/darwin.nix)。

[tools]
"gem:terminal-notifier" = "latest"
# ローカル LLM (OCI では使わない)。
ollama = "latest"
# CoreAudio のルーティング (BlackHole 2ch と組み合わせて使う)。
"github:gw31415/audiorouter" = "latest"
# OpenAI MCP control-plane へのトンネル。下の [bootstrap.macos.launchd.agents] が
# mise shim 経由で `tunnel-client run --profile local-mcp-stdio` を常駐させ、
# トンネル先の local-mcp も PATH (mise shim) から起動する。
# NOTE: OCI のトンネルは /etc/dev-session-mcp-tunnel の system service で、
#       ここで導入するものとは別物。
"github:openai/tunnel-client" = "latest"
"cargo:https://github.com/nakasyou/local-mcp" = "latest"

# Host packages do not create mise shims. The ARM Homebrew prefix keeps the
# `mas` command available to bootstrap's Mac App Store package manager.
[env]
_.path = ["/opt/homebrew/bin"]

[dotfiles]
"~/.config/ghostty" = { source = "config/ghostty", mode = "symlink" }
"~/.config/audiorouter" = { source = "config/audiorouter", mode = "symlink" }
"~/.config/tunnel-client" = { source = "config/tunnel-client", mode = "symlink" }
# ログインシェルは Homebrew の fish。zsh は予備として設定だけ置く。OCI には zsh が無い。
"~/.zprofile" = { source = "files/zprofile", mode = "symlink" }
"~/.zshenv" = { source = "files/zshenv", mode = "symlink" }
"~/.zshrc" = { source = "files/zshrc", mode = "symlink" }
# TeX は Mac にだけある。
"~/.latexmkrc" = { source = "files/latexmkrc", mode = "symlink" }

# Brewfile 相当。Homebrew 本体を shell task から呼び出さず、
# mise が宣言状態を検査して必要な package だけを導入する。
# Arto は third-party tap の cask で mise が安全に評価できないため、
# 必要な Mac で `brew install --cask arto-app/tap/arto` を手動実行する。
[bootstrap.packages]
"brew:cocoapods" = "latest"
"brew:openssl@3" = "latest"
"brew:gettext" = "latest"
"brew:gnupg" = "latest"
"brew:libgpg-error" = "latest"
"brew:mas" = "latest"
"brew:pinentry-mac" = "latest"
"brew:pkgconf" = "latest"
"brew:xcode-build-server" = "latest"
"brew:jorgelbg/tap/pinentry-touchid" = "latest"
"brew:steipete/tap/codexbar" = "latest"
"brew-cask:anki" = "latest"
"brew-cask:blackhole-2ch" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:claude-code" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:codex-app" = "latest"
"brew-cask:discord" = "latest"
# Pelmet は Dimble に改名された (tap の cask_renames.json)。
"brew-cask:fif7y/tap/dimble" = "latest"
# 端末は Rex Beta.app に移行中。Ghostty は既定では入れない (設定の symlink は残す)。
# "brew-cask:ghostty" = "latest"
"brew-cask:gnucash" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:iloader" = "latest"
"brew-cask:keybase" = "latest"
"brew-cask:macfuse" = "latest"
"brew-cask:macskk" = "latest"
"brew-cask:musicbrainz-picard" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:puremac" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:smoothcsv" = "latest"
"brew-cask:vorssaint" = "latest"
# "brew-cask:waku" = "latest"
"brew-cask:zoom" = "latest"
"mas:1365531024" = "latest" # 1Blocker
# "mas:937984704" = "latest" # Amphetamine → Vorssaint or dopa で代用できる
"mas:361285480" = "latest" # Keynote
"mas:539883307" = "latest" # LINE
"mas:634148309" = "latest" # Logic Pro
"mas:6444915884" = "latest" # Ice Cubes for Mastodon
"mas:361304891" = "latest" # Numbers
"mas:361309726" = "latest" # Pages
"mas:497799835" = "latest" # Xcode
"mas:415166115" = "latest" # タイピスト
"mas:1598123076" = "latest" # 宛名印刷

# ログインシェル。`/etc/shells` への登録と chsh を mise bootstrap が行う。
# nix-darwin の environment.shells は /etc/shells を丸ごと所有して手編集済みの
# ファイルと衝突するため使わない。
[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# built-in package phase では PATH にない mas を skip することがあるため、
# Homebrew の bin を追加した mise env で Mac App Store entries だけを収束する。
#
# pinentry-touchid は Homebrew の `pinentry` の既定に戻ってしまうため、upgrade や
# relink の後に pinentry-mac へ向け直す (GPG 署名で Touch ID を出すため)。
# `-fix` が起動した pinentry-mac は Assuan の handshake を待ち続けて bootstrap を
# 止めるので、stdin を閉じて EOF を渡し、10 秒で打ち切る。
[bootstrap.hooks.post-packages]
run = [
  "mise exec -- mise bootstrap packages apply --manager mas",
  """
  if [ -x /opt/homebrew/bin/pinentry-touchid ]; then
    PATH=/opt/homebrew/bin:$PATH /opt/homebrew/bin/pinentry-touchid -fix </dev/null >/dev/null 2>&1 &
    pid=$!
    i=0
    while kill -0 "$pid" 2>/dev/null; do
      i=$((i + 1))
      if [ "$i" -ge 10 ]; then
        kill "$pid" 2>/dev/null
        wait "$pid" 2>/dev/null
        break
      fi
      sleep 1
    done
  fi
  """,
]

########################################
# macOS defaults (旧 nix-darwin の system.defaults)
########################################
# mise は Dock・Finder を再起動しないため、反映には再ログインか `killall Dock Finder`。
[bootstrap.macos.defaults]
# Spotlight の呼び出しを無効化。
"com.apple.Spotlight" = { MenuItemHidden = true }
# 4本指・5本指のピンチを無効化 (内蔵と Bluetooth の両方)。
"com.apple.AppleMultitouchTrackpad" = { TrackpadFourFingerPinchGesture = 0, TrackpadFiveFingerPinchGesture = 0 }
"com.apple.driver.AppleBluetoothMultitouch.trackpad" = { TrackpadFourFingerPinchGesture = 0, TrackpadFiveFingerPinchGesture = 0 }

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllExtensions = true
CreateDesktop = true
FXDefaultSearchScope = "SCcf"
FXEnableExtensionChangeWarning = false
FXPreferredViewStyle = "Nlsv"
ShowPathbar = true
ShowStatusBar = false

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
show-recents = false
tilesize = 50
magnification = true
largesize = 64
orientation = "bottom"
launchanim = true
# 親指と3本指を広げてデスクトップを表示するジェスチャーを無効化。
showDesktopGestureEnabled = false

# Rex Beta.app (端末)。設定ファイルは無く、すべて UserDefaults に保存される。
# Homebrew cask が無いのでアプリ本体は公式サイトから手動で入れる (~/Applications)。
# ウィンドウ位置・Sparkle の更新状態・同期先サーバー・ソケットのキャッシュなど
# マシン固有の値は宣言しない。反映には Rex の再起動が要る。
[bootstrap.macos.defaults."com.superlogical.rex"]
# 外観はシステムに従い、ライト/ダークで別テーマを使う。
"Workspace.appearance" = "system"
"Workspace.lightThemeID" = "merino-light"
"Workspace.darkThemeID" = "merino-dark"
"Workspace.interfaceStyle" = "blendTheme"
"Workspace.inactivePaneFadeMode" = "both"
"Workspace.usesStandardInactiveWindowPaneStyles" = true
"Workspace.tabIconTintMode" = "off"
"Workspace.terminalFontName" = "HackGen Console NF"
"Workspace.terminalFontPointSize" = 13.0
"Workspace.terminalAllowsLigatures" = false
"Workspace.terminalFontSmoothing" = false
"Workspace.terminalSmoothScrolling" = false
"Workspace.terminalCursorBlinkUsesCustomInterval" = false
"Workspace.terminalCursorBlinkIntervalMilliseconds" = 0
"rex.agents.names-sessions" = true
"rex.client.remoteControl" = true
"rex.server.run-mode" = "bundled"
"rex.server.automatic-restart-enabled" = true
"rex.server.block-plugin-reload-enabled" = false
"rex.server.tailnet-enabled" = true

# Spotlight のショートカット (64, 65) だけを無効化し、他のホットキーは残す。
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "enabled"]
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["65", "enabled"]
value = false

########################################
# LaunchAgents (旧 nix-darwin の launchd.user.agents)
########################################
# Neovim の denops プラグインが接続する共通 Deno サーバー。Vim/Neovim 起動ごとに
# Deno を spawn しないので denops 系プラグインがすぐ使える。
# サーバーは rsplug が入れた denops.vim と同じ版を使う (nvim 側と版がずれない)。
# rsplug 導入前や deno の shim が無い間は落ちるが、keep_alive が再試行する。
[bootstrap.macos.launchd.agents.denops-shared-server]
program = "/bin/bash"
args = [
  "-c",
  """
  repo="$HOME/.cache/rsplug/repos/github.com/vim-denops/denops.vim"
  exec "$HOME/.local/share/mise/shims/deno" run -A --no-lock -q \
    "$repo/worktrees/$(cat "$repo/latest-snapshot")/denops/@denops-private/cli.ts" \
    --hostname 127.0.0.1 --port 32123
  """,
]
run_at_load = true
keep_alive = true
throttle_interval = 30
stdout_path = "~/Library/Logs/denops-shared-server.log"
stderr_path = "~/Library/Logs/denops-shared-server.log"

# rsplug の設定 (config/nvim_rsplug/*.toml) を監視し、変わるたびに再ビルドする。
# 新しい世代が公開されると、起動中の Neovim は require('rsplug').watch() で気づく。
# launchd はシェルの環境を引き継がないので、ビルドで使う nvim・git を shims から渡す。
[bootstrap.macos.launchd.agents.rsplug-watch]
program = "{{ env.HOME }}/.local/share/mise/shims/rsplug"
args = ["--watch", "-i", "{{ env.HOME }}/.config/mise/config/nvim_rsplug/*.toml"]
environment = { PATH = "{{ env.HOME }}/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~"
run_at_load = true
keep_alive = true
throttle_interval = 30
stdout_path = "~/Library/Logs/rsplug-watch.log"
stderr_path = "~/Library/Logs/rsplug-watch.log"

# ローカル MCP サーバー (local-mcp) を OpenAI の制御プレーンへ常駐トンネルする。
# プロファイル local-mcp-stdio は api_key を env:CONTROL_PLANE_API_KEY で参照するため、
# 起動時に ~/.env を source する (シークレットを設定ファイルに書かない)。
# local-mcp は tunnel-client から PATH 経由で起動されるため mise shims を通す。
[bootstrap.macos.launchd.agents.tunnel-client]
program = "/bin/bash"
args = [
  "-c",
  """
  set -eo pipefail
  if [[ -f "$HOME/.env" ]]; then
    set -a
    source "$HOME/.env"
    set +a
  fi
  export PATH="$HOME/.local/share/mise/shims:$PATH"
  exec "$HOME/.local/share/mise/shims/tunnel-client" run --profile local-mcp-stdio
  """,
]
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/tunnel-client/tunnel-client.log"
stderr_path = "~/Library/Logs/tunnel-client/tunnel-client.error.log"
