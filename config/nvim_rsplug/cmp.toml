[[plugins]]
repo = "atusy/laser.nvim"
on_event = ["VeryLazy", "InsertEnter", "CmdlineEnter"]
lua_after = '''
local laser = require 'laser'

-- copilot-language-server は textDocument/completion を持たないため laser には出てこない。
-- Copilot は copilot.lua の suggestion (ゴーストテキスト) で出し、<Tab> で受け入れる。
local function copilot_visible()
    return package.loaded['copilot.suggestion'] ~= nil and require 'copilot.suggestion'.is_visible()
end

local group = vim.api.nvim_create_augroup('my-laser', { clear = true })
local function complete_insert()
    laser.complete {
        menu = { auto_select = true, preview = true }
    }
end
vim.api.nvim_create_autocmd({ 'InsertEnter', 'TextChangedI' }, {
    group = group,
    callback = complete_insert
})
-- `:` は kakehashi 経由の vimls で補完する
vim.api.nvim_create_autocmd({ 'CmdlineEnter', 'CmdlineChanged' }, {
    group = group,
    pattern = ':',
    callback = function ()
        laser.complete { language_id = 'vim' }
    end
})

local function fallback(key)
    -- t: 'wildchar' などをタイプしたキーとして扱わせる
    vim.api.nvim_feedkeys(vim.keycode(key), 'int', false)
end
local function map(modes, key, action)
    vim.keymap.set(modes, key, function ()
        if action() == false then
            fallback(key)
        end
    end, { desc = 'laser: ' .. key })
end
local function when_visible(f)
    return function ()
        if not laser.visible() then return false end
        f()
    end
end

-- super-tab 相当: 補完を確定 → Copilot を受け入れ → スニペットを進める → <Tab>
map({ 'i', 'c' }, '<Tab>', function ()
    if laser.visible() then
        if laser.get_selected() == nil then
            laser.select(1, { insert = false })
        end
        return laser.confirm()
    elseif vim.fn.mode() == 'i' and copilot_visible() then
        require 'copilot.suggestion'.accept()
    elseif vim.fn.mode() == 'i' and vim.snippet.active { direction = 1 } then
        vim.snippet.jump(1)
    else
        return false
    end
end)
map({ 'i', 'c' }, '<C-n>', when_visible(function () laser.select(1) end))
map({ 'i', 'c' }, '<C-p>', when_visible(function () laser.select(-1) end))
map({ 'i', 'c' }, '<Down>', when_visible(function () laser.select(1) end))
map({ 'i', 'c' }, '<Up>', when_visible(function () laser.select(-1) end))
map({ 'i', 'c' }, '<C-e>', when_visible(laser.cancel))
map('i', '<C-f>', when_visible(function () laser.scroll_preview(4) end))
map('i', '<C-b>', when_visible(function () laser.scroll_preview(-4) end))
vim.keymap.set('i', '<C-Space>', complete_insert, { desc = 'laser: complete' })

-- `:` 補完用の scratch バッファを先に作り、kakehashi → vimls を起動しておく。
-- 初回の CmdlineEnter で作るとサーバの起動待ちになり、入ってすぐは補完が出ない。
require 'laser.cmdline'.ensure_buffer 'vim'

-- VeryLazy より前に InsertEnter / CmdlineEnter で読まれた場合は、そのイベント分をここで補う
if vim.fn.mode() == 'i' then
    complete_insert()
elseif vim.fn.getcmdtype() == ':' then
    laser.complete { language_id = 'vim' }
end
'''
