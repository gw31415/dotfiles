[[plugins]]
lua_start = '''
vim.g.loaded_node_provider = 0
vim.g.loaded_perl_provider = 0
vim.g.loaded_ruby_provider = 0
vim.g.loaded_python3_provider = 0

----------------------------
-- Disable built-in plugins
----------------------------

vim.g.loaded_netrwPlugin = true
vim.g.loaded_remote_plugins = true
vim.g.skip_loading_mswin = true
vim.g.loaded_tutor_mode_plugin = true
vim.g.loaded_2html_plugin = true

----------------------------
-- Lazy loading
----------------------------

vim.schedule(function ()
    require 'init_lazy'
    vim.api.nvim_exec_autocmds('User', { pattern = 'VeryLazy', modeline = false })
end)

----------------------------
-- Personal settings
----------------------------

vim.go.encoding = 'utf-8'
vim.opt_global.fencs = { 'utf-8', 'iso-2022-jp', 'euc-jp', 'sjis' }
vim.wo.number = true
vim.go.winblend = 20
vim.go.pumblend = 20
vim.go.guifont = 'HackGen_Console_NF:h14'
vim.opt.shiftwidth = 4
vim.opt.tabstop = 4
vim.go.cmdheight = 0
vim.opt.fillchars = { eob = ' ', foldopen = '󱨉', foldclose = '', foldsep = ' ', foldinner = '' }

vim.cmd 'filetype plugin indent on'

vim.filetype.add {
    filename = {
        Appfile = 'ruby',
        config = 'config'
    }
}
'''

[[plugins]]
repo = "vim-denops/denops.vim"
sym = true # NOTE: denops.vim は要所コピーではなくシンボリックリンクで参照させないと動かない
start = true
merge = false # denops の autoload は他プラグインと merge してはならない
lua_before = '''
if vim.loop.os_uname().sysname == 'Darwin' then
	vim.g.denops_server_addr = '127.0.0.1:32123'
end
'''

[[plugins]]
repo = "lambdalisue/vim-gin"
start = true
depends = "denops.vim"
lua_after = '''
vim.g.gin_proxy_apply_without_confirm = 1
vim.g.gin_proxy_editor_opener = 'bo sp'
vim.keymap.set('n', '<c-g>c', '<cmd>Gin commit<cr>', { silent = true })
vim.keymap.set('n', '<c-g>C', '<cmd>Gin commit --amend<cr>', { silent = true })
'''

[[plugins]]
repo = "lambdalisue/vim-kensaku"
start = true
depends = "denops.vim"
lua_after = "vim.call('kensaku#set_roman_table', require 'dvorakjp'.kensaku)"

[[plugins]]
repo = "yuki-yano/fuzzy-motion.vim"
start = true
depends = ["denops.vim", "vim-kensaku"]
lua_after = '''
vim.keymap.set('n', '<Space>', '<cmd>FuzzyMotion<cr>')
vim.g.fuzzy_motion_labels = {
	'U', 'H', 'E', 'T', 'O', 'N', 'A', 'S', 'P', 'G', 'I', 'D', 'K', 'B', 'J', 'M',
}
vim.g.fuzzy_motion_matchers = { 'fzf', 'kensaku' }
'''

[[plugins]]
repo = "vim-skk/skkeleton"
start = true
depends = "denops.vim"
lua_after = '''
vim.keymap.set({ 'i', 'c', 't' }, '<C-j>', '<Plug>(skkeleton-enable)')

vim.fn['skkeleton#config'] {
	markerHenkan = '▹',
	eggLikeNewline = true,
	markerHenkanSelect = '▸',
	globalDictionaries = { '~/.skk/SKK-JISYO.L' },
	selectCandidateKeys = 'aoeuhtn',
}

for _, map in pairs {
	{ 'input',  '<c-e>', '' },
	{ 'henkan', '<c-e>', '' },
	{ 'input',  '<c-n>', 'henkanFirst' },
	{ 'henkan', '<c-n>', 'henkanForward' },
	{ 'henkan', '<c-p>', 'henkanBackward' },
	{ 'henkan', '<bs>',  'henkanBackward' },
	{ 'henkan', '<c-h>', '' },
	{ 'henkan', '<c-h>', 'henkanBackward' },
} do
	vim.fn['skkeleton#register_keymap'](unpack(map))
end

vim.call('skkeleton#register_kanatable', 'rom', require 'dvorakjp'.skkeleton)
'''

[[plugins]]
repo = "lambdalisue/vim-guise"
start = true
depends = "denops.vim"

