[settings]
experimental = true
cargo.binstall_only = true
idiomatic_version_file_enable_tools = ["python", "node", "go"]
# タスクはツール導入を自前管理する (bootstrap: mise install / update: mise up)。
# link のような軽量タスクで全ツールチェインの自動導入が走らないように切る。
task.run_auto_install = false

[tools]
cargo-binstall = "latest"
# 言語ランタイム (mise が正。rust は rustup 例外のため入れない)。
node = "latest"
go = "latest"
python = "latest"
ruby = "latest"
deno = "2"
uv = "latest"
"aqua:pnpm" = "11"
rust = "latest"
sccache = "latest"
# .NET SDK (GCM の dotnet: backend に必要。現行 GCM は .NET SDK 10 必須)。
dotnet = "10"
# Git Credential Manager (.NET tool として mise 管理。git 側の helper=manager が shim を解決)。
# NOTE: `mise install` は `git-credential-manager configure` 相当を行わないが、
# config/git/config で helper を宣言済みのため初回の configure 手順は不要。
"dotnet:git-credential-manager" = "latest"

# シェル・シェル統合 (旧 home-manager programs.* 相当)。
"aqua:fish-shell/fish-shell" = "latest"
fzf = "latest"
fd = "latest"
"github:iffse/pay-respects" = "latest"
"github:tetzng/pez" = "latest"

# LSP / Formatter (Nix・mason から移管)。
"github:atusy/kakehashi" = "latest"
"aqua:astral-sh/ty" = "latest"
"npm:basedpyright" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
tree-sitter = "latest"
"cargo:mergiraf" = "latest"
"npm:fish-lsp" = "latest"
# mason から移管 (clangd / nil / vim-language-server は mise に無いため mason 維持)。
"aqua:astral-sh/ruff" = "latest"
"aqua:biomejs/biome" = "latest"
"aqua:tamasfe/taplo" = "latest"
"aqua:Myriad-Dreamin/tinymist" = "latest"
"aqua:rhysd/actionlint" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:@typespec/compiler" = "latest"
"npm:oxlint" = "latest"
# NOTE: latest は beta を拾うため stable 系列にピン留め
"gem:ruby-lsp" = "0.26"

# 開発 CLI (Nix から移管)。
gh = "latest"
lazygit = "latest"
jq = "latest"
jnv = "latest"
yt-dlp = "latest"
pandoc = "latest"
vhs = "latest"
"pipx:litecli" = "latest"
ollama = "latest"
claude = "latest"
codex = "latest"

# 日常 CLI
# aria2 = "latest" # バイナリインストールできる手段が存在しない
bat = "latest"
eza = "latest"
tmux = "latest"
ffmpeg = "latest"
imagemagick = "latest"
"7zip" = "latest"
"aqua:charmbracelet/freeze" = "latest"
"aqua:neovim" = "latest"
"pipx:asciinema" = "latest"
"cargo:https://github.com/itsjunetime/tdf" = "latest"
"go:github.com/itchyny/mmv/cmd/mmv" = "latest"
"go:github.com/rhysd/vim-startuptime" = "latest"
"conda:poppler" = "latest"
"conda:librsvg" = "latest"

# 既存維持。
aube = "latest"
"gem:terminal-notifier" = { version = "latest", os = "macos" }
"github:gw31415/commitgen" = { version = "latest", bin = "commitgen" }
"github:gw31415/rsplug.nvim" = { version = "latest", bin = "rsplug" }
"github:gw31415/audiorouter" = "latest"
"npm:trash-cli" = "latest"
usage = "latest"
"github:isak102/neowright" = "latest"
# "cargo:https://github.com/jkcoxson/idevice_pair" = "latest"
"hunkdiff" = "latest"
"mdbook" = "latest"
oh-my-pi = "latest"
"cargo:https://github.com/nakasyou/local-mcp" = "latest"
"github:openai/tunnel-client" = "latest"
"pipx:serena-agent" = "latest"
tssh = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = [
	"@opencode-ai/cli",
] }
"github:microsoft/tgrep" = "latest"

# NOTE: aquaレジストリなし・npmなし・cargoはbinstall提供なし・ubiは非推奨のためgithubバックエンド。
# 同一リリースに複数バイナリ同梱のためtool_alias+matchingで分割する。
[tool_alias]
emmylua_ls = "github:EmmyLuaLs/emmylua-analyzer-rust"
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"
luafmt = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools.emmylua_ls]
version = "latest"
matching = "emmylua_ls"

[tools.emmylua_check]
version = "latest"
matching = "emmylua_check"

[tools.luafmt]
version = "latest"
matching = "luafmt"

# home.sessionVariables から移行した開発環境変数。
# NOTE: RSPLUG_CONFIG_FILES は config/fish/conf.d/15-rsplug.fish で定義
#       (mise の {{ config_root }} は user-global では $HOME を指すため fish 側で解決)。
[env]
EDITOR = "nvim" # aqua:neovim の shim が提供
DIRENV_LOG_FORMAT = ""
GOPATH = "{{ env.HOME }}/.go" # go は mise 管理
RUSTC_WRAPPER = "{{ env.HOME }}/.local/share/mise/shims/sccache" # Nix store から mise shim へ切替

[wrappers]
ssh = "tssh"

# NOTE: user-global config では mise の root 変数 (config_root 等) が $HOME を指すため、
# スクリプトパスはリンク先の定番パス ($HOME/.config/mise) で指定する。
# 初回は `config/mise/tasks/link.sh` を直接実行して symlink を作り、`mise trust` すること。
[tasks.link]
description = "Symlink dotfiles (config/*, files/*) into $HOME"
run = [
  'test -x "$HOME/.config/mise/tasks/link.sh" || { echo "run ./config/mise/tasks/link.sh directly first (then: mise trust <repo>)"; exit 1; }',
  'exec "$HOME/.config/mise/tasks/link.sh"',
]

[tasks.bootstrap]
description = "Bootstrap machine: link + package layers + tools + login shell"
run = [
  'test -x "$HOME/.config/mise/tasks/bootstrap.sh" || { echo "run ./config/mise/tasks/link.sh directly first (then: mise trust <repo>)"; exit 1; }',
  'exec "$HOME/.config/mise/tasks/bootstrap.sh"',
]

[tasks.update]
description = "Update tools, plugins and package layers"
run = [
  'test -x "$HOME/.config/mise/tasks/update.sh" || { echo "run ./config/mise/tasks/link.sh directly first (then: mise trust <repo>)"; exit 1; }',
  'exec "$HOME/.config/mise/tasks/update.sh"',
]
